<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luisoft Simulador">
<link rel="manifest" href="manifest.json">
<title>Luisoft Simulador</title>
<style>
  :root { --bg:#0b1d33; --card:#132b48; --line:#1f3d61; --txt:#e8eef7; --mut:#9db2cc; --gold:#f5b700; --ok:#2ecc71; --bad:#e74c3c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { min-height:100vh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { text-align:center; padding:18px 0 8px; }
  header h1 { margin:0; font-size:22px; letter-spacing:1px; }
  header h1 span { color:var(--gold); }
  header p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  .screen { display:none; max-width:560px; margin:0 auto; }
  .screen.active { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:12px 0; }
  label { display:block; font-size:14px; color:var(--mut); margin-bottom:6px; }
  input[type=text] { width:100%; padding:14px; border-radius:10px; border:1px solid var(--line); background:#0e2238; color:var(--txt); font-size:16px; }
  button { cursor:pointer; border:none; border-radius:12px; padding:14px 18px; font-size:16px; font-weight:600; width:100%; background:var(--gold); color:#1a1a1a; margin-top:10px; }
  button.secondary { background:transparent; color:var(--txt); border:1px solid var(--line); }
  button:disabled { opacity:.45; }
  .meta { display:flex; justify-content:space-between; color:var(--mut); font-size:14px; }
  .bar { height:6px; background:#0e2238; border-radius:4px; overflow:hidden; margin:10px 0 14px; }
  .bar > div { height:100%; background:var(--gold); width:0; transition:width .3s; }
  .topic { display:inline-block; font-size:12px; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:3px 10px; margin-bottom:10px; }
  .question { font-size:18px; line-height:1.45; margin:6px 0 14px; }
  .opt { display:flex; align-items:flex-start; gap:10px; padding:14px; border:1px solid var(--line); border-radius:12px; margin:8px 0; cursor:pointer; background:#0e2238; }
  .opt b { min-width:26px; height:26px; border-radius:50%; border:1px solid var(--mut); display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
  .opt.correct { border-color:var(--ok); background:rgba(46,204,113,.12); }
  .opt.correct b { background:var(--ok); color:#06210f; border-color:var(--ok); }
  .opt.wrong { border-color:var(--bad); background:rgba(231,76,60,.12); }
  .opt.wrong b { background:var(--bad); color:#fff; border-color:var(--bad); }
  .opt.disabled { cursor:default; }
  .explain { margin-top:12px; font-size:14px; color:var(--mut); }
  .big { font-size:56px; font-weight:800; text-align:center; margin:10px 0 0; color:var(--gold); }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center; margin-top:14px; }
  .stats div { background:#0e2238; border-radius:10px; padding:12px 6px; }
  .stats strong { display:block; font-size:22px; }
  .stats span { font-size:12px; color:var(--mut); }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .warn { color:#ffb4a8; font-size:14px; }
  .history-item { font-size:14px; padding:8px 0; border-bottom:1px solid var(--line); }
  footer { text-align:center; color:var(--mut); font-size:12px; padding:20px 0; }
</style>
</head>
<body>

<header>
  <h1>LUISOFT <span>SIMULADOR</span></h1>
  <p>Ministério do Interior · Prova escrita</p>
</header>

<!-- ECRÃ 1: nome do candidato -->
<section id="screen-start" class="screen active">
  <div class="card">
    <label for="candName">Nome do candidato</label>
    <input type="text" id="candName" placeholder="Escreva o seu nome completo" maxlength="80" autocomplete="name">
    <p id="startMsg" class="warn"></p>
    <button id="btnStart">Iniciar simulado (50 perguntas)</button>
  </div>
  <div class="card">
    <label>Histórico de simulados</label>
    <div id="history"></div>
  </div>
</section>

<!-- ECRÃ 2: prova -->
<section id="screen-quiz" class="screen">
  <div class="card">
    <div class="meta"><span id="qCount"></span><span id="qScore"></span></div>
    <div class="bar"><div id="qBar"></div></div>
    <span class="topic" id="qTopic"></span>
    <div class="question" id="qText"></div>
    <div id="qOpts"></div>
    <div class="explain" id="qExplain"></div>
    <button id="btnNext" disabled>Próxima</button>
  </div>
</section>

<!-- ECRÃ 3: resultado -->
<section id="screen-result" class="screen">
  <div class="card" style="text-align:center">
    <div>Candidato</div>
    <h2 id="rName" style="margin:4px 0 0"></h2>
    <div class="big" id="rNota"></div>
    <div style="color:var(--mut)">nota do simulado (escala de 0 a 20)</div>
    <div style="margin-top:12px;font-size:20px;font-weight:700" id="rPct"></div>
    <div style="color:var(--mut)">percentagem de respostas certas</div>
    <div class="stats">
      <div><strong id="rOk" style="color:var(--ok)"></strong><span>Certas</span></div>
      <div><strong id="rBad" style="color:var(--bad)"></strong><span>Erradas</span></div>
      <div><strong id="rTot"></strong><span>Total</span></div>
    </div>
    <p id="rVerdict" style="margin-top:14px"></p>
  </div>
  <div class="card">
    <label>Desempenho por tópico</label>
    <div id="rTopics"></div>
  </div>
  <button id="btnNew">Novo simulado</button>
  <button class="secondary" id="btnReview">Rever respostas</button>
  <div class="card" id="reviewBox" style="display:none"></div>
</section>

<footer>Luisoft Simulador · v1.1</footer>

<script src="questions.js"></script>
<script src="questions-b.js"></script>
<script src="questions-c.js"></script>
<script src="questions-d.js"></script>
<script src="questions-e.js"></script>
<script>
(function () {
  const SIM_SIZE = 50;
  const PASS = 50; // percentagem mínima de aprovação (ajustável)
  const KEY = "luisoft_historico_v1";

  const $ = id => document.getElementById(id);
  const screens = { start: $("screen-start"), quiz: $("screen-quiz"), result: $("screen-result") };
  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
  }

  let bank = (window.QUESTIONS || []).filter(q => q && q.q && Array.isArray(q.o) && q.o.length >= 2);
  let sim = null; // estado do simulado atual

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function saveHistory(h) {
    try { localStorage.setItem(KEY, JSON.stringify(h)); } catch (e) {}
  }

  function renderHistory() {
    const h = loadHistory();
    const box = $("history");
    if (!h.length) { box.innerHTML = '<p style="color:var(--mut);font-size:14px">Ainda não há simulados.</p>'; return; }
    box.innerHTML = h.slice(-10).reverse().map(r =>
      `<div class="history-item"><b>${escapeHtml(r.nome)}</b> — nota ${r.nota != null ? String(r.nota).replace(".", ",") + "/20" : ""} · ${r.pct}% (${r.ok}/${r.total}) · ${r.data}</div>`
    ).join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  $("btnStart").addEventListener("click", () => {
    const nome = $("candName").value.trim();
    const msg = $("startMsg");
    if (nome.length < 3) { msg.textContent = "Introduza o nome do candidato (mínimo 3 caracteres)."; return; }
    if (bank.length < SIM_SIZE) {
      msg.textContent = `Banco com ${bank.length} perguntas. São necessárias pelo menos ${SIM_SIZE} para iniciar o simulado.`;
      return;
    }
    msg.textContent = "";
    const picked = shuffle(bank).slice(0, SIM_SIZE).map(q => {
      // baralha as opções mantendo a resposta correta
      const idx = q.o.map((_, i) => i);
      const order = shuffle(idx);
      return { q: q.q, t: q.t || "Geral", o: order.map(i => q.o[i]), a: order.indexOf(q.a), e: q.e || "" };
    });
    sim = { nome, items: picked, i: 0, answers: [], startedAt: new Date() };
    show("quiz");
    renderQuestion();
  });

  function renderQuestion() {
    const item = sim.items[sim.i];
    const n = sim.items.length;
    $("qCount").textContent = `Pergunta ${sim.i + 1} de ${n}`;
    const ok = sim.answers.filter(a => a.correct).length;
    $("qScore").textContent = `Certas: ${ok}`;
    $("qBar").style.width = (sim.i / n * 100) + "%";
    $("qTopic").textContent = item.t;
    $("qText").textContent = item.q;
    $("qExplain").textContent = "";
    const box = $("qOpts");
    box.innerHTML = "";
    item.o.forEach((txt, k) => {
      const d = document.createElement("div");
      d.className = "opt";
      d.innerHTML = `<b>${String.fromCharCode(65 + k)}</b><span>${escapeHtml(txt)}</span>`;
      d.addEventListener("click", () => answer(k));
      box.appendChild(d);
    });
    $("btnNext").disabled = true;
    $("btnNext").textContent = sim.i === n - 1 ? "Ver resultado" : "Próxima";
  }

  function answer(k) {
    const item = sim.items[sim.i];
    if (sim.answers[sim.i]) return; // já respondida
    const correct = k === item.a;
    sim.answers[sim.i] = { topic: item.t, correct, chosen: k };
    const opts = $("qOpts").children;
    for (let j = 0; j < opts.length; j++) {
      opts[j].classList.add("disabled");
      if (j === item.a) opts[j].classList.add("correct");
      if (j === k && !correct) opts[j].classList.add("wrong");
    }
    if (item.e) $("qExplain").textContent = "Nota: " + item.e;
    $("qScore").textContent = `Certas: ${sim.answers.filter(a => a && a.correct).length}`;
    $("btnNext").disabled = false;
  }

  $("btnNext").addEventListener("click", () => {
    if (sim.i < sim.items.length - 1) { sim.i++; renderQuestion(); }
    else finish();
  });

  function finish() {
    const total = sim.items.length;
    const ok = sim.answers.filter(a => a && a.correct).length;
    const pct = Math.round(ok / total * 100);
    const nota = Math.round(ok / total * 200) / 10; // escala de 0 a 20, uma casa decimal
    const data = new Date().toLocaleString("pt-PT");

    const h = loadHistory();
    h.push({ nome: sim.nome, pct, nota, ok, total, data });
    saveHistory(h);

    $("rName").textContent = sim.nome;
    $("rNota").textContent = nota.toFixed(1).replace(".", ",") + " / 20";
    $("rPct").textContent = pct + "% de respostas certas";
    $("rOk").textContent = ok;
    $("rBad").textContent = total - ok;
    $("rTot").textContent = total;
    $("rVerdict").innerHTML = pct >= PASS
      ? '<span style="color:var(--ok);font-weight:700">Aprovado no simulado</span>'
      : '<span style="color:var(--bad);font-weight:700">Não atingiu os ' + PASS + '% necessários</span>';

    // desempenho por tópico
    const topics = {};
    sim.answers.forEach(a => {
      if (!a) return;
      topics[a.topic] = topics[a.topic] || { ok: 0, tot: 0 };
      topics[a.topic].tot++;
      if (a.correct) topics[a.topic].ok++;
    });
    $("rTopics").innerHTML = Object.keys(topics).map(t => {
      const p = Math.round(topics[t].ok / topics[t].tot * 100);
      return `<div class="row"><span>${escapeHtml(t)}</span><span>${topics[t].ok}/${topics[t].tot} · ${p}%</span></div>`;
    }).join("");

    // revisão
    $("reviewBox").style.display = "none";
    $("reviewBox").innerHTML = sim.items.map((it, idx) => {
      const a = sim.answers[idx];
      const good = a && a.correct;
      const resp = a ? it.o[a.chosen] : "(sem resposta)";
      return `<div class="history-item"><b>${idx + 1}. ${escapeHtml(it.q)}</b><br>
        <span style="color:${good ? "var(--ok)" : "var(--bad)"}">Respondeu: ${escapeHtml(resp)}</span>
        ${good ? "" : `<br><span style="color:var(--ok)">Correta: ${escapeHtml(it.o[it.a])}</span>`}</div>`;
    }).join("");

    show("result");
  }

  $("btnReview").addEventListener("click", () => {
    const b = $("reviewBox");
    b.style.display = b.style.display === "none" ? "block" : "none";
  });
  $("btnNew").addEventListener("click", () => {
    sim = null;
    $("candName").value = "";
    renderHistory();
    show("start");
  });

  if (window.innerWidth > 0) renderHistory();
})();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
